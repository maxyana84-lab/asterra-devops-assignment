# Public MapServer: the only workload published outside the cluster (NodePort).
apiVersion: v1
kind: Service
metadata:
  name: mapserver
  namespace: asterra
spec:
  type: NodePort
  selector:
    app: mapserver
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapserver
  namespace: asterra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mapserver
  template:
    metadata:
      labels:
        app: mapserver
    spec:
      containers:
        - name: mapserver
          image: asterra-mapserver:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities
              port: 8080
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 33 # www-data
            allowPrivilegeEscalation: false

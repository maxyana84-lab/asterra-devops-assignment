# PostgreSQL with PostGIS: the local stand-in for the private RDS instance.
# The password lives in the Secret "postgis-credentials", which deploy-local.sh
# generates; it is not in this repository.
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: asterra
spec:
  clusterIP: None # headless: stable DNS name for the StatefulSet
  selector:
    app: postgis
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: asterra
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:17-3.5
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: geodata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgis-credentials, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgis-credentials, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d geodata"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

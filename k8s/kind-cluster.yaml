# Single-node local cluster. MapServer's NodePort is published on the host,
# the same way the Elastic IP publishes it on AWS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: asterra
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
